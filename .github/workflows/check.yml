name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm test
      - run: dotnet build desktop/DouyinAutomation.Desktop/DouyinAutomation.Desktop.csproj -c Release
      - run: dotnet build desktop/DouyinAutomation.Launcher/DouyinAutomation.Launcher.csproj -c Release
